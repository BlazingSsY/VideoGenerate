# Nginx 反向代理 —— 如果你已经在用 Nginx，用这份
#
# 证书用 certbot 申请：
#   certbot certonly --nginx -d video.example.com
# 然后把下面的域名和证书路径改掉，.env 里填 APP_DOMAIN 与 BEHIND_PROXY=true

upstream video_generate {
    server 127.0.0.1:8008;
    keepalive 32;
}

# HTTP 只做跳转（证书签发期间 certbot 需要 .well-known 可访问）
server {
    listen 80;
    listen [::]:80;
    server_name video.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name video.example.com;

    ssl_certificate     /etc/letsencrypt/live/video.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 上传参考图：要 >= .env 里的 MAX_UPLOAD_MB，留一倍余量
    client_max_body_size 64m;

    # 生成任务轮询 + 视频代理下载，超时给足，否则大文件下到一半会断
    proxy_connect_timeout 60s;
    proxy_send_timeout    30m;
    proxy_read_timeout    30m;

    location / {
        proxy_pass http://video_generate;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 视频是流式转发的，不要缓冲，否则大文件会先落到 Nginx 磁盘
        proxy_buffering off;
    }

    # 生成的视频与上传的参考图：链接带签名和有效期，
    # 缓存策略由后端的 Cache-Control 决定，这里不要覆盖，
    # 也不要丢掉 query string（签名就在里面）。
    location /media/ {
        proxy_pass http://video_generate;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
